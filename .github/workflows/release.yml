name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Plugin tag to publish, e.g. v1.2.3'
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: build and publish plugin
    runs-on: ubuntu-latest
    # secrets.* cannot be read from a step-level `if`, so the presence check
    # below goes through the job environment instead.
    env:
      HAS_HUB_CREDENTIAL: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true

      # Never publish a plugin that does not pass its own tests.
      - name: gofmt, vet and tests
        run: ./scripts/unit.sh

      - name: resolve plugin tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: echo "value=${INPUT_TAG:-$GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: publish ${{ steps.tag.outputs.value }}
        run: make push PLUGIN_TAG="${{ steps.tag.outputs.value }}"

      # The README tells users to install without a tag, which resolves to
      # :latest, so a release has to move that too. Pre-release tags carry a
      # hyphen (v1.2.3-rc1) and must not.
      - name: publish latest
        if: ${{ !contains(steps.tag.outputs.value, '-') }}
        run: make push PLUGIN_TAG=latest

      # Docker Hub keeps one overview per repository, not one per tag, so this
      # runs once per release and the tag it was released from is what the
      # overview then documents. A pre-release must not move it, same as
      # :latest.
      #
      # Docker Hub rejects full_description updates authenticated with a
      # personal access token ("access to the resource is forbidden with
      # personal access token"); the account password is accepted. This reuses
      # DOCKERHUB_TOKEN because that is the credential already proven to work
      # against Hub here -- if it holds a password the overview updates, and if
      # it holds a PAT the step logs a 403.
      #
      # continue-on-error because the overview is cosmetic: a plugin that built
      # and pushed correctly must not be marked a failed release over it.
      - name: update the Docker Hub overview
        if: ${{ !contains(steps.tag.outputs.value, '-') && env.HAS_HUB_CREDENTIAL == 'true' }}
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: glabservices/gcloud-secret
          short-description: Google Cloud Secret Manager secret provider for Docker Swarm
          readme-filepath: ./README.md
          enable-url-completion: true
